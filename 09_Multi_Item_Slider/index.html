<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Multi Item Slider</title>
</head>

<body>
    <div class="container">
        <h1>Gallery</h1>
        <div class="galleryCover">
            <div class="gallery">
                <div class="d-inline-flex galleryItems">
                    <div class="col-xl-3 col-lg-4 col-md-4 col-sm-6 col-12 px-2 item"><img src="images/img1.jpg" /></div>
                    <div class="col-xl-3 col-lg-4 col-md-4 col-sm-6 col-12 px-2 item"><img src="images/img2.jpg" /></div>
                    <div class="col-xl-3 col-lg-4 col-md-4 col-sm-6 col-12 px-2 item"><img src="images/img3.jpg" /></div>
                    <div class="col-xl-3 col-lg-4 col-md-4 col-sm-6 col-12 px-2 item"><img src="images/img4.jpg" /></div>
                    <div class="col-xl-3 col-lg-4 col-md-4 col-sm-6 col-12 px-2 item"><img src="images/img5.jpg" /></div>
                    <div class="col-xl-3 col-lg-4 col-md-4 col-sm-6 col-12 px-2 item"><img src="images/img6.jpg" /></div>
                    <div class="col-xl-3 col-lg-4 col-md-4 col-sm-6 col-12 px-2 item"><img src="images/img7.jpg" /></div>
                    <div class="col-xl-3 col-lg-4 col-md-4 col-sm-6 col-12 px-2 item"><img src="images/img8.jpg" /></div>
                    <div class="col-xl-3 col-lg-4 col-md-4 col-sm-6 col-12 px-2 item"><img src="images/img9.jpg" /></div>
                    <div class="col-xl-3 col-lg-4 col-md-4 col-sm-6 col-12 px-2 item last"><img src="images/img10.jpg" /></div>
                </div> <!-- galleryItems -->
            </div> <!-- gallery -->
            <!-- buttons -->
            <button id="prevBtn">←</button>
            <button id="nextBtn">→</button>
        </div><!-- galleryCover -->
    </div><!-- container -->

    <!-- back button -->
    <a href="../" class="home">← &nbsp;Go To Home</a>
    <script src="javascript.js"></script>
</body>

</html>
