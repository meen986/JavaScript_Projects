<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Increase Decrease</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
            color: rgba(255, 255, 255, 0.8);
        }

        body {
            background-color: darkcyan;
        }

        a{text-decoration: none;}

        h1 {
            text-align: center;
            margin: 40px 0;
            color: #fff;
        }

        h2{
            margin-bottom: 10px;
        }

        h4{
            color: rgba(255, 255, 255, 0.5);
        }

        ul {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 0 50px;
        }

        ul li {
            list-style: none;
            flex: calc(50% - 20px);
            max-width: calc(50% - 20px);
        }

        ul li a {
            display: inline-block;
            width: 100%;
            height: 100%;
            background-color: #222;
            padding: 50px;
            border-radius: 10px;
            transition: all 0.3s;
        }

        ul li a:hover{
            background-color: #000;
        }

/* back button */
        .home{
            position: fixed;
            bottom: 10px;
            left: 10px;
            background-color: #fff;
            display: inline-block;
            padding: 20px 40px;
            border-radius: 50px;
            color: #333;
            transition: all 0.3s;
        }

        .home:hover{
            left: 20px;
        }
    </style>
</head>

<body>
    <h1>Count Increase Decrease</h1>
    <ul>
        <li>
            <a href="Count_Increase_Decrease_Part_1/">
                <h2>Part 1</h2>
                <h3>Automatically increase and decrease number on click</h3>
                <h4>setInterval() is mostly used in this program.</h4>
            </a>
        </li>
        <li>
            <a href="Count_Increase_Decrease_Part_2/">
                <h2>Part 2</h2>
                <h3>Increase and decrease number each time you click</h3>
                <h4>Used forEach() and target the button on clicking.</h4>
            </a>
        </li>
    </ul>

    <!-- back button -->
    <a href="../" class="home">← &nbsp;Go To Home</a>
</body>

</html>
