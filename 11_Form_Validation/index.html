<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Validation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
            color: rgba(255, 255, 255, 0.8);
        }

        body {
            background-color: dimgrey;
        }

        a {
            text-decoration: none;
        }

        h1 {
            text-align: center;
            margin: 40px 0;
            color: #fff;
        }

        h2 {
            margin-bottom: 10px;
        }

        h4 {
            color: rgba(255, 255, 255, 0.5);
        }

        ul {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin: 0 50px;
        }

        ul li {
            list-style: none;
            flex: calc(50% - 20px);
            max-width: calc(50% - 10px);
        }

        ul li a {
            display: inline-block;
            width: 100%;
            height: 100%;
            background-color: #222;
            padding: 50px;
            border-radius: 10px;
            transition: all 0.3s;
        }

        ul li a:hover {
            background-color: #000;
        }

        /* back button */
        .home {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background-color: #fff;
            display: inline-block;
            padding: 20px 40px;
            border-radius: 50px;
            color: #333;
            transition: all 0.3s;
        }

        .home:hover {
            left: 20px;
        }
    </style>
</head>

<body>
    <h1>Form Validation</h1>
    <ul>
        <li>
            <a href="From_Validation_Part_1/">
                <h2>Part 1</h2>
                <h3>Form Validation Alert</h3>
                <h4>All Validation will come one by one as a alert box.</h4>
            </a>
        </li>
    </ul>

    <!-- back button -->
    <a href="../" class="home">← &nbsp;Go To Home</a>
</body>

</html>
